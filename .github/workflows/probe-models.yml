name: Probe Models

on:
  workflow_dispatch:

permissions:
  models: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Models endpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "===== 1) GET catalog/models (auth) ====="
          curl -s --max-time 30 -o /tmp/b1 -D /tmp/h1 -w "HTTP %{http_code}\n" https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
          grep -i -E '^(content-type|x-github-request-id|apim-request-id|x-request-id|server):' /tmp/h1 || true
          head -c 400 /tmp/b1; echo
          echo "===== 2) POST inference/chat/completions openai/gpt-4o-mini (auth) ====="
          curl -s --max-time 60 -o /tmp/b2 -D /tmp/h2 -w "HTTP %{http_code}\n" -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":10}'
          grep -i -E '^(content-type|x-github-request-id|apim-request-id|x-request-id|server):' /tmp/h2 || true
          head -c 600 /tmp/b2; echo
          echo "===== 3) POST chat BOGUS model (auth) ====="
          curl -s --max-time 30 -o /tmp/b3 -w "HTTP %{http_code}\n" -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"model":"bogus/model-zzz-nonexistent","messages":[{"role":"user","content":"hi"}],"max_tokens":5}'
          head -c 400 /tmp/b3; echo
          echo "===== 4) POST legacy models.inference.ai.azure.com gpt-4o-mini (auth) ====="
          curl -s --max-time 60 -o /tmp/b4 -w "HTTP %{http_code}\n" -X POST https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}],"max_tokens":10}'
          head -c 600 /tmp/b4; echo
          echo "===== 5) GET inference root (auth) ====="
          curl -s --max-time 30 -o /tmp/b5 -w "HTTP %{http_code}\n" https://models.github.ai/inference -H "Authorization: Bearer $GH_TOKEN"
          head -c 200 /tmp/b5; echo
          echo "===== 6) POST chat NO AUTH ====="
          curl -s --max-time 30 -o /tmp/b6 -w "HTTP %{http_code}\n" -X POST https://models.github.ai/inference/chat/completions -H "Content-Type: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"hi"}],"max_tokens":5}'
          head -c 400 /tmp/b6; echo
          echo "===== PROBE DONE ====="
